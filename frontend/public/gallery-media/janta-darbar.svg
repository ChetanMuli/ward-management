<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="officeWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="woodTable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="darbarBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="darbarOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(76,29,149,0)"/>
      <stop offset="60%" stop-color="rgba(76,29,149,0.5)"/>
      <stop offset="100%" stop-color="rgba(46,16,101,0.96)"/>
    </linearGradient>
    <filter id="shadowDarbar" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Office Interior Background -->
  <rect width="800" height="340" fill="url(#officeWall)"/>
  <rect y="340" width="800" height="160" fill="#64748b"/>

  <!-- Back Wall Civic Emblem Banner & Framed Photo -->
  <g transform="translate(250, 40)">
    <rect x="0" y="0" width="300" height="70" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2" filter="url(#shadowDarbar)"/>
    <!-- Indian National Tricolor Stripe -->
    <rect x="15" y="12" width="270" height="4" fill="#f97316"/>
    <rect x="15" y="16" width="270" height="4" fill="#ffffff"/>
    <rect x="15" y="20" width="270" height="4" fill="#16a34a"/>
    <text x="150" y="44" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="16" font-weight="900" fill="#4c1d95" text-anchor="middle">प्रभाग जनसंपर्क कार्यालय</text>
    <text x="150" y="58" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">CITIZEN GRIEVANCE REDRESSAL DESK · WARD 3</text>
  </g>

  <!-- Notice Board on Left Wall -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="110" height="130" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="12" y="15" width="86" height="6" fill="#b45309"/>
    <rect x="12" y="30" width="70" height="4" fill="#64748b"/>
    <rect x="12" y="40" width="80" height="4" fill="#64748b"/>
    <rect x="12" y="50" width="60" height="4" fill="#64748b"/>
    <rect x="12" y="70" width="86" height="40" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="55" y="95" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0284c7" text-anchor="middle">जनता दरबार</text>
  </g>

  <!-- Large Conference / Redressal Desk -->
  <g transform="translate(180, 220)">
    <!-- Wooden Table Top -->
    <polygon points="40,40 400,40 430,110 10,110" fill="url(#woodTable)" filter="url(#shadowDarbar)"/>
    <!-- Table Front Skirt -->
    <rect x="10" y="110" width="420" height="50" fill="#78350f"/>
    <!-- Files and Laptop on Desk -->
    <rect x="80" y="55" width="45" height="35" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="180" y="48" width="60" height="42" rx="4" fill="#0f172a"/>
    <rect x="185" y="52" width="50" height="30" rx="2" fill="#38bdf8"/>
    <!-- Desk Nameplate -->
    <rect x="190" y="92" width="60" height="14" rx="2" fill="#fbbf24" stroke="#d97706"/>
    <text x="220" y="102" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#0f172a" text-anchor="middle">नगरसेवक</text>
  </g>

  <!-- Nagarsevak sitting at Center of Desk -->
  <g transform="translate(370, 150)">
    <!-- Formal Executive Chair -->
    <rect x="10" y="10" width="60" height="90" rx="8" fill="#1e293b"/>
    <!-- Nagarsevak Head & Torso -->
    <circle cx="40" cy="40" r="18" fill="#fed7aa"/>
    <path d="M 22 40 Q 40 15 58 40 Z" fill="#1e293b"/>
    <path d="M 15 85 Q 15 62 40 62 Q 65 62 65 85 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <!-- White Kurta / Saffron Scarf -->
    <path d="M 28 62 L 32 90 M 52 62 L 48 90" stroke="#f97316" stroke-width="4"/>
  </g>

  <!-- Resident 1 (Senior Citizen speaking) on Left Chair -->
  <g transform="translate(230, 190)">
    <circle cx="30" cy="30" r="16" fill="#fde047" opacity="0.3"/>
    <circle cx="30" cy="30" r="15" fill="#fed7aa"/>
    <path d="M 18 30 Q 30 18 42 30 Z" fill="#94a3b8"/> <!-- Grey hair -->
    <path d="M 12 75 Q 12 52 30 52 Q 48 52 48 75 Z" fill="#0284c7"/>
    <!-- Citizen Complaint Paper in Hand -->
    <rect x="42" y="65" width="22" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" transform="rotate(-15, 42, 65)"/>
  </g>

  <!-- Resident 2 (Woman Resident listening) on Right Chair -->
  <g transform="translate(520, 190)">
    <circle cx="30" cy="30" r="15" fill="#fed7aa"/>
    <path d="M 15 30 Q 30 12 45 30 Z" fill="#0f172a"/>
    <path d="M 12 75 Q 12 52 30 52 Q 48 52 48 75 Z" fill="#db2777"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="url(#darbarBadge)" filter="url(#shadowDarbar)"/>
    <circle cx="17" cy="17" r="7" fill="#c4b5fd"/>
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">जनसंवाद / JANTA DARBAR</text>
  </g>

  <g transform="translate(630, 30)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="70" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">२६ सप्टेंबर २०२६</text>
  </g>

  <!-- Bottom Gradient Overlay -->
  <rect x="0" y="320" width="800" height="180" fill="url(#darbarOverlay)"/>

  <!-- Caption & Project Details -->
  <g transform="translate(35, 415)">
    <rect x="0" y="-2" width="220" height="20" rx="4" fill="#a78bfa"/>
    <text x="8" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#2e1065">👥 थेट नागरिक संवाद व निवारण</text>
    <text x="0" y="42" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">साप्ताहिक जनता दरबार व तक्रार निवारण</text>
    <text x="0" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#ddd6fe">जनसंपर्क कार्यालय, सावेडी · समस्यांचे तात्काळ व पारदर्शक निवारण</text>
  </g>
</svg>
