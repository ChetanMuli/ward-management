# Nginx configuration for WardDesk / WardSetu
server {
    listen 80;
    server_name myward.navraje.xyz wardv1.navraje.xyz _;

    client_max_body_size 50M;

    root /var/www/ward-management/frontend/dist;
    index index.html;

    # Static uploads with fallback to backend proxy
    location /api/uploads/ {
        alias /var/www/ward-management/backend/uploads/;
        try_files $uri @backend_proxy;
        expires 30d;
        access_log off;
    }

    location /uploads/ {
        alias /var/www/ward-management/backend/uploads/;
        try_files $uri @backend_proxy;
        expires 30d;
        access_log off;
    }

    # API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location @backend_proxy {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dedicated SPA routes to guarantee no 403 directory conflicts on page reload
    location = /gallery {
        try_files /index.html =404;
    }
    location = /gallery/ {
        try_files /index.html =404;
    }

    # React Single Page App fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
